<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Profil Użytkownika - e-wydarzenia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <a href="index.html" class="logo-link">E-Wydarzenia</a>
    <div class="login-section">
      <a href="index.html" class="back-btn">Powrót do głównej</a>
      <button class="logout-btn" onclick="logout()">Wyloguj się</button>
    </div>
  </div>

  <div class="container">
    <h1>Profil Użytkownika</h1>

    <div class="profile-grid">
      <div class="profile-sections">
        <div class="profile-section">
          <h2>Ulubione wydarzenia</h2>
          <p>Brak ulubionych wydarzeń.</p>
        </div>

        <div class="profile-section">
          <h2>Opinie</h2>
          <p>Brak opinii.</p>
        </div>
      </div>

      <div class="profile-card">
        <h2>Informacje o użytkowniku</h2>      <div class="profile-avatar">
        <img id="avatar" src="img/5.png" alt="" onerror="this.src=pickRandomAvatar()" />
      </div>        <p><strong>Nazwa użytkownika:</strong> <span id="username">Ładowanie...</span></p>
        <p><strong>Email:</strong> <span id="email">Ładowanie...</span></p>
        <p><strong>Data rejestracji:</strong> <span id="registrationDate">Ładowanie...</span></p>
        <button class="edit-btn">Edytuj profil</button>
      </div>
    </div>

    <!-- Modal edycji profilu -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Edytuj profil</h2>
        <form id="editForm">
          <label for="editUsername">Nazwa użytkownika:</label>
          <input type="text" id="editUsername" name="username" required>

          <label for="editEmail">Email:</label>
          <input type="email" id="editEmail" name="email" required>

          <label for="editPassword">Nowe hasło:</label>
          <input type="password" id="editPassword" name="password">

          <label for="editConfirmPassword">Potwierdź hasło:</label>
          <input type="password" id="editConfirmPassword" name="confirmPassword">

          <label for="editAvatar">Zdjęcie profilowe:</label>
            <select id="editAvatar" name="avatar">
              <option value="img/1.jpg">Profilowe 1</option>
              <option value="img/2.jpg">Profilowe 2</option>
              <option value="img/3.jpg">Profilowe 3</option>
              <option value="img/4.jpg">Profilowe 4</option>
              <option value="img/5.png">Profilowe 5</option>
            </select>
            <div style="margin:10px 0;text-align:center;">
              <img id="avatarPreview" src="img/5.png" alt="Podgląd profilowego" style="max-width:100px;max-height:100px;border-radius:50%;border:1px solid #ccc;" />
            </div>

          <button type="submit">Zapisz zmiany</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function logout() {
      fetch('/logout', { method: 'POST' })
      .then(() => {
        window.location.href = 'index.html';
      })
      .catch(() => alert('Błąd wylogowania'));
    }

    function pickRandomAvatar() {
      const avatars = [
        'img/1.jpg',
        'img/2.jpg',
        'img/3.jpg',
        'img/4.jpg',
        'img/5.png'
      ];
      return avatars[Math.floor(Math.random() * avatars.length)];
    }

    document.addEventListener('DOMContentLoaded', function() {
      // ustaw losowe zdjęcie przed ładowaniem danych
      document.getElementById('avatar').src = pickRandomAvatar();

      fetch('/profile')
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          alert(data.error);
          window.location.href = 'index.html';
        } else {
          document.getElementById('username').textContent = data.username;
          document.getElementById('email').textContent = data.email;
          document.getElementById('registrationDate').textContent = new Date(data.created_at).toLocaleDateString('pl-PL');
          document.getElementById('avatar').src = data.avatar;
        }
      })
      .catch(() => {
        alert('Błąd pobierania profilu');
        window.location.href = 'index.html';
      });
    });

    // Modal edycji
    const modal = document.getElementById('editModal');
    const editBtn = document.querySelector('.edit-btn');
    const closeBtn = document.querySelector('.close');
    const editForm = document.getElementById('editForm');

    editBtn.onclick = function() {
      modal.style.display = 'block';
      // Wypełnij formularz
      document.getElementById('editUsername').value = document.getElementById('username').textContent;
      document.getElementById('editEmail').value = document.getElementById('email').textContent;
        document.getElementById('editAvatar').value = document.getElementById('avatar').src.replace(window.location.origin + '/', '');
        document.getElementById('avatarPreview').src = document.getElementById('avatar').src;
    }

    closeBtn.onclick = function() {
      modal.style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = 'none';
      }
    }

      // Podgląd profilowego przy zmianie wyboru
      document.getElementById('editAvatar').addEventListener('change', function() {
        document.getElementById('avatarPreview').src = this.value;
      });

    editForm.onsubmit = function(e) {
      e.preventDefault();
      const formData = new FormData(editForm);
      const data = Object.fromEntries(formData);
      if (data.password && data.password !== data.confirmPassword) {
        alert('Hasła się nie zgadzają!');
        return;
      }
      delete data.confirmPassword;

      fetch('/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(result => {
        if (result.message) {
          alert('Profil zaktualizowany');
          modal.style.display = 'none';
          location.reload(); // Odśwież stronę, aby zobaczyć zmiany
        } else {
          alert(result.error);
        }
      })
      .catch(() => alert('Błąd aktualizacji'));
    }
  </script>
</body>
</html>
