<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Profil Użytkownika - e-wydarzenia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-userid="">
  <div class="navbar">
    <a href="index.html" class="logo-link">E-Wydarzenia</a>
    <div class="login-section">
      <button class="logout-btn" onclick="logout()">Wyloguj się</button>
    </div>
  </div>

  <div class="container">
    <h1>Profil Użytkownika</h1>

    <div class="profile-grid">
      <div class="profile-sections">
        <div class="profile-section">
          <h2>Ulubione wydarzenia</h2>
          <div id="favoritesList"><span class="empty-info">Ładowanie...</span></div>
        </div>

        <div class="profile-section">
          <h2>Opinie</h2>
          <p>Brak opinii.</p>
        </div>
      </div>

      <div class="profile-card">
        <h2>Informacje o użytkowniku</h2>      <div class="profile-avatar">
        <img id="avatar" src="img/5.png" alt="" onerror="this.src=pickRandomAvatar()" />
      </div>        <p><strong>Nazwa użytkownika:</strong> <span id="username">Ładowanie...</span></p>
        <p><strong>Email:</strong> <span id="email">Ładowanie...</span></p>
        <p><strong>Data rejestracji:</strong> <span id="registrationDate">Ładowanie...</span></p>
        <button class="edit-btn">Edytuj profil</button>
      </div>
    </div>

    <!-- Modal edycji profilu -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Edytuj profil</h2>
        <form id="editForm">
          <label for="editUsername">Nazwa użytkownika:</label>
          <input type="text" id="editUsername" name="username" required>

          <label for="editEmail">Email:</label>
          <input type="email" id="editEmail" name="email" required>

          <label for="editPassword">Nowe hasło:</label>
          <input type="password" id="editPassword" name="password">

          <label for="editConfirmPassword">Potwierdź hasło:</label>
          <input type="password" id="editConfirmPassword" name="confirmPassword">

          <label for="editAvatar">Zdjęcie profilowe:</label>

            <select id="avatarSelect" name="avatarSelect">
              <option value="img/1.jpg">Profilowe 1</option>
              <option value="img/2.jpg">Profilowe 2</option>
              <option value="img/3.jpg">Profilowe 3</option>
              <option value="img/4.jpg">Profilowe 4</option>
              <option value="img/5.png">Profilowe 5</option>
              <option value="custom">Własne zdjęcie</option>
            </select>
            <input type="file" id="editAvatar" name="avatar" accept="image/*" style="display:none; margin-top:8px;" />
            <div style="margin:10px 0;text-align:center;">
              <img id="avatarPreview" src="img/5.png" alt="Podgląd profilowego" style="max-width:100px;max-height:100px;border-radius:50%;border:1px solid #ccc;" />
            </div>

          <button type="submit">Zapisz zmiany</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function logout() {
      fetch('/logout', { method: 'POST' })
      .then(() => {
        window.location.href = 'index.html';
      })
      .catch(() => alert('Błąd wylogowania'));
    }

    function pickRandomAvatar() {
      const avatars = [
        'img/1.jpg',
        'img/2.jpg',
        'img/3.jpg',
        'img/4.jpg',
        'img/5.png'
      ];
      return avatars[Math.floor(Math.random() * avatars.length)];
    }

    document.addEventListener('DOMContentLoaded', function() {
      // ustaw losowe zdjęcie przed ładowaniem danych
      document.getElementById('avatar').src = pickRandomAvatar();

      fetch('/profile')
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            alert(data.error);
            window.location.href = 'index.html';
          } else {
            document.getElementById('username').textContent = data.username;
            document.getElementById('email').textContent = data.email;
            document.getElementById('registrationDate').textContent = new Date(data.created_at).toLocaleDateString('pl-PL');
            // Pobierz avatar jako blob
            document.body.dataset.userid = data.id;
            fetch(`/avatar/${data.id}`)
              .then(r => r.blob())
              .then(blob => {
                const url = URL.createObjectURL(blob);
                document.getElementById('avatar').src = url;
                document.getElementById('avatarPreview').src = url;
              });
          }
        })
        .catch(() => {
          alert('Błąd pobierania profilu');
          window.location.href = 'index.html';
        });

      // Pobierz ulubione wydarzenia i szczegóły z Ticketmaster
      fetch('/favorites', { credentials: 'include' })
        .then(res => res.json())
        .then(async favs => {
          const list = document.getElementById('favoritesList');
          list.innerHTML = '';
          if (Array.isArray(favs) && favs.length > 0) {
            // Pobierz szczegóły dla każdego eventu
            const details = await Promise.all(favs.map(async id => {
              try {
                const res = await fetch(`https://app.ticketmaster.com/discovery/v2/events/${id}.json?apikey=CAhoJ1QvIdpfnH5HnOy9jnGrQV0ahSMH`);
                if (!res.ok) return null;
                const ev = await res.json();
                return {
                  id,
                  name: ev.name,
                  date: ev.dates?.start?.localDate,
                  venue: ev._embedded?.venues?.[0]?.name
                };
              } catch {
                return null;
              }
            }));
            const ul = document.createElement('ul');
            ul.style.listStyle = 'none';
            ul.style.paddingLeft = '0';
            details.forEach(ev => {
              const li = document.createElement('li');
              if (ev && ev.name) {
                // Link do mapy Google Maps po nazwie miejsca
                let mapUrl = '';
                if (ev.venue) {
                  mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.venue)}`;
                }
                li.innerHTML = `
                  <span style='color:#e67e22;font-weight:bold;font-size:1.1em;'>${ev.name}</span><br>
                  <span style='color:#0077b6'>${ev.venue || ''}</span>
                  ${mapUrl ? `&nbsp;|&nbsp;<a href='${mapUrl}' target='_blank' style='color:#007bff;text-decoration:underline;font-size:0.95em;'>Otwórz mapę</a>` : ''}<br>
                  <span style='color:#555'>${ev.date || ''}</span>
                  <button style="margin-left:10px;color:#fff;background:#e74c3c;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:0.95em;" onclick="removeFavorite('${ev.id}', this)">Usuń</button>
                `;
              } else {
                li.textContent = 'Nie udało się pobrać szczegółów wydarzenia.';
              }
              ul.appendChild(li);
            });
            list.appendChild(ul);
            // Funkcja do usuwania ulubionego wydarzenia (globalnie)
            window.removeFavorite = function(eventId, btn) {
              fetch('/favorites', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ eventId }),
                credentials: 'include'
              })
                .then(res => res.json())
                .then(() => {
                  // Usuń element z listy
                  const li = btn.closest('li');
                  if (li) li.remove();
                  // Jeśli lista pusta, pokaż info
                  const list = document.getElementById('favoritesList');
                  if (!list.querySelector('ul') || list.querySelector('ul').children.length === 0) {
                    list.innerHTML = '<span class="empty-info">Brak ulubionych wydarzeń.</span>';
                  }
                })
                .catch(() => alert('Błąd usuwania ulubionego wydarzenia.'));
            }
          } else {
            list.innerHTML = '<span class="empty-info">Brak ulubionych wydarzeń.</span>';
          }
        })
        .catch(() => {
          const list = document.getElementById('favoritesList');
          list.innerHTML = '<span class="empty-info">Błąd pobierania ulubionych.</span>';
        });
    });

    // Modal edycji
    const modal = document.getElementById('editModal');
    const editBtn = document.querySelector('.edit-btn');
    const closeBtn = document.querySelector('.close');
    const editForm = document.getElementById('editForm');

    editBtn.onclick = function() {
      modal.style.display = 'block';
      document.getElementById('editUsername').value = document.getElementById('username').textContent;
      document.getElementById('editEmail').value = document.getElementById('email').textContent;
      document.getElementById('avatarPreview').src = document.getElementById('avatar').src;
      document.getElementById('avatarSelect').value = '';
      document.getElementById('editAvatar').value = '';
      document.getElementById('editAvatar').style.display = 'none';
    }

    closeBtn.onclick = function() {
      modal.style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = 'none';
      }
    }

      // Obsługa wyboru avatara
      const avatarSelect = document.getElementById('avatarSelect');
      const avatarFileInput = document.getElementById('editAvatar');
      avatarSelect.addEventListener('change', function() {
        if (this.value === 'custom') {
          avatarFileInput.style.display = 'block';
        } else {
          avatarFileInput.style.display = 'none';
          document.getElementById('avatarPreview').src = this.value;
        }
      });
      avatarFileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(e) {
            document.getElementById('avatarPreview').src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

    editForm.onsubmit = function(e) {
      e.preventDefault();
      const formData = new FormData();
      formData.append('username', document.getElementById('editUsername').value);
      formData.append('email', document.getElementById('editEmail').value);
      if (document.getElementById('editPassword').value) {
        if (document.getElementById('editPassword').value !== document.getElementById('editConfirmPassword').value) {
          alert('Hasła się nie zgadzają!');
          return;
        }
        formData.append('password', document.getElementById('editPassword').value);
      }
      let avatarPromise = Promise.resolve();
      let avatarValue = '';
      // Pobierz id użytkownika z profilu (potrzebne do /avatar/:id)
      const userId = document.body.dataset.userid || null;
      if (avatarSelect.value === 'custom' && avatarFileInput.files[0]) {
        // Upload własnego pliku
        const uploadData = new FormData();
        uploadData.append('avatar', avatarFileInput.files[0]);
        avatarPromise = fetch('/upload-avatar', {
          method: 'POST',
          body: uploadData,
          credentials: 'include'
        }).then(res => res.json()).then(result => {
          if (!result.message) {
            alert(result.error || 'Błąd uploadu avatara');
            throw new Error('Upload failed');
          }
          // Użyj userId do ścieżki avatara
          avatarValue = userId ? `/avatar/${userId}` : '';
        });
      } else if (avatarSelect.value && avatarSelect.value !== 'custom') {
        avatarValue = avatarSelect.value;
      }
      avatarPromise.then(() => {
        // Update profilu
        const data = Object.fromEntries(formData);
        // Jeśli wybrano gotowy avatar, wyślij avatar w PUT /profile
        if (avatarSelect.value && avatarSelect.value !== 'custom') {
          data.avatar = avatarValue;
        }
        fetch('/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include'
        })
        .then(res => res.json())
        .then(result2 => {
          if (result2.message) {
            alert('Profil zaktualizowany');
            modal.style.display = 'none';
            location.reload();
          } else {
            alert(result2.error);
          }
        });
      });
    }
  </script>
</body>
</html>
